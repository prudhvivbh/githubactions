name: Pull Request Greeting

# El flujo se dispara únicamente cuando se abre un nuevo Pull Request
on:
  pull_request:
    types: [opened]

jobs:
  welcome-comment:
    name: Dejar comentario de bienvenida
    runs-on: ubuntu-latest

    # Justificación teórica: Por defecto, los tokens de Actions tienen permisos de solo lectura.
    # Debemos otorgar explícitamente permiso de escritura en 'pull-requests' para publicar el comentario.
    permissions:
      pull-requests: write 

    steps:
      # Utilizamos github-script, una acción oficial que permite correr JavaScript 
      # interactuando directamente con la API de GitHub (Octokit) sin autenticación manual.
      - name: Crear comentario en el PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '¡Hola! 🚀 Gracias por abrir este Pull Request. El equipo de Telemática lo revisará pronto.'
            })
